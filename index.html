<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>豬豬的生活簡報</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        :root {
            --bg-cream: #F9F6F0; --card-white: #FFFFFF; --text-dark: #2C3E35; --text-muted: #8A9A90;
            --green-deep: #4A7C59; --green-soft: #A3B899; --brown-dirt: #D4A373;
            --yellow-warm: #EED7A1; --red-soft: #D98C8C;
        }

        body {
            background-color: var(--bg-cream); color: var(--text-dark);
            font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; 
        }
        ::-webkit-scrollbar { display: none; }

        /* 卡片設計 */
        .bento-card {
            background-color: var(--card-white); border-radius: 32px;
            box-shadow: 0 8px 24px rgba(74, 124, 89, 0.04), 0 2px 8px rgba(74, 124, 89, 0.02);
            border: 1px solid rgba(163, 184, 153, 0.15); padding: 24px; position: relative; overflow: hidden;
            margin-bottom: 16px;
        }
        
        .bento-item { background: #F4F5F3; border-radius: 24px; padding: 16px; }

        /* 經驗值與任務 */
        .exp-bar { height: 8px; background-color: #E8EBE9; border-radius: 999px; overflow: hidden; }
        .exp-fill { height: 100%; background-color: var(--yellow-warm); transition: width 0.5s ease-out; }
        .task-checkbox { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .task-done { background-color: var(--green-deep); border-color: var(--green-deep); animation: popIn 0.4s; }
        @keyframes popIn { 0% { transform: scale(0.8); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* 標籤 Tag */
        .tag-pill {
            display: inline-block; background-color: rgba(163, 184, 153, 0.2); color: var(--green-deep);
            padding: 6px 12px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .tag-pill:active { transform: scale(0.9); background-color: var(--green-soft); color: white; }

        /* 磨砂玻璃信封 (時光膠囊) */
        .glass-envelope {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05), inset 0 0 20px rgba(255,255,255,0.5);
            border-radius: 24px; overflow: hidden; position: relative;
        }
        .envelope-fill {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(180deg, #FDE68A 0%, #F59E0B 100%);
            transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0.8; z-index: 0;
        }

        /* 冰凍卡片 (慾望停車場) */
        .ice-card {
            border: 2px solid #E0F2F1; border-radius: 20px; transition: all 0.5s; background: white;
            box-shadow: inset 0 0 15px rgba(224,242,241,0.5); position: relative; overflow: hidden;
        }
        .frozen {
            background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(224,242,241,0.8));
            border: 2px solid #B2DFDB; filter: grayscale(0.3) brightness(0.95);
        }
        .frozen::after {
            content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 10L20 20M80 10L70 20" stroke="%23ffffff" stroke-width="2" stroke-linecap="round"/></svg>') repeat; opacity: 0.3; pointer-events: none;
        }

        /* 光束飛入動畫 */
        @keyframes flyIntoEnvelope {
            0% { transform: translateY(0) scale(1); opacity: 1; filter: brightness(1); }
            40% { transform: translateY(-100px) scale(1.2); filter: brightness(1.5); }
            100% { transform: translateY(-300px) scale(0.2); opacity: 0; filter: brightness(2); }
        }
        .fly-anim { animation: flyIntoEnvelope 0.8s cubic-bezier(0.25, 1, 0.3, 1) forwards; pointer-events: none; z-index: 50; }

        /* 月底雜誌 Zine */
        .zine-modal {
            position: fixed; inset: 0; z-index: 100; background: #FAF8F5; overflow-y: auto;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .zine-cover { background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=800'); background-size: cover; background-position: center; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* UI 元件 */
        .bottom-nav { background-color: var(--card-white); border-top-left-radius: 32px; border-top-right-radius: 32px; box-shadow: 0 -4px 24px rgba(44, 62, 53, 0.05); }
        .natural-input { background: var(--card-white); border: 2px solid #E8EBE9; border-radius: 999px; padding: 16px 24px; width: 100%; color: var(--text-dark); font-weight: bold; outline: none; transition: 0.2s; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .natural-input:focus { border-color: var(--green-soft); box-shadow: 0 10px 25px rgba(163, 184, 153, 0.2); }
        
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--text-dark); color: white; padding: 12px 24px; border-radius: 999px;
            font-weight: bold; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 110;
            animation: slideDown 0.3s forwards, fadeOut 0.3s 2.7s forwards; white-space: nowrap;
        }
        @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_STATE = {
            player: { level: 2, exp: 60, maxExp: 100 },
            assets: 152400,
            tasks: { expense: { done: false }, diary: { done: false } },
            // 固定支出雷達
            bills: [
                { id: 'b1', name: '房租', amount: 15000, daysLeft: 5 },
                { id: 'b2', name: '婷', amount: 30000, daysLeft: 5 },
                { id: 'b12', name: '豬手機話費', amount: 3000, daysLeft: 25 },
            ],
            // 記事與時光流
            diaries: [
                { id: 1, text: '今天跟朋友去喝 #星巴克 花了 $150，聊得很開心。', amount: 150, tags: ['星巴克'], date: '10/24' },
                { id: 2, text: '買了 #Bo弟奶粉 花了 $1200，寶貝長得真快！', amount: 1200, tags: ['Bo弟奶粉'], date: '10/22' }
            ],
            tagStats: { '星巴克': 1450, 'Bo弟奶粉': 3600 },
            // 未來願望
            envelope: { title: '歐洲之旅 10 萬元', target: 100000, current: 95000, letter: "給未來的自己：辛苦存錢的日子結束了！帶上相機，我們去巴黎看鐵塔吧！✈️" },
            wishes: [
                { id: 1, name: '新款 Dyson 吸塵器', cost: 4000, daysLeft: 7, frozen: true },
                { id: 2, name: '名牌小包包', cost: 8500, daysLeft: 0, frozen: true } // 0天代表可解凍抉擇
            ]
        };

        function App() {
            const [data, setData] = useState(INITIAL_STATE);
            const [activeTab, setActiveTab] = useState('journal'); // home, journal, future
            
            const [toastMsg, setToastMsg] = useState(null);
            const [journalInput, setJournalInput] = useState('');
            const [tagModal, setTagModal] = useState(null); // 點擊標籤彈出的視窗
            const [showZine, setShowZine] = useState(false); // 月底雜誌
            const [animatingWishId, setAnimatingWishId] = useState(null); // 飛行動畫 ID

            const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 3000); };

            const gainRewards = (exp) => {
                setData(prev => {
                    let newExp = prev.player.exp + exp;
                    let newLevel = prev.player.level;
                    if (newExp >= prev.player.maxExp) {
                        newExp -= prev.player.maxExp; newLevel += 1;
                        setTimeout(() => showToast(`🎉 升級！成為 Lv.${newLevel} 豬豬！`), 800);
                    }
                    return { ...prev, player: { ...prev.player, level: newLevel, exp: newExp } };
                });
            };

            // --- 核心操作 ---

            // 自然語言輸入解析
            const handleJournalSubmit = (e) => {
                if(e.key !== 'Enter' || !journalInput.trim()) return;
                
                // 正則表達式抓取金額 ($150 或 150元)
                const amtMatch = journalInput.match(/\$(\d+)|(\d+)\s*元/);
                const amount = amtMatch ? parseInt(amtMatch[1] || amtMatch[2]) : 0;
                
                // 抓取 #標籤
                const tagsMatch = journalInput.match(/#(\S+)/g);
                const tags = tagsMatch ? tagsMatch.map(t => t.substring(1)) : [];

                const newDiary = {
                    id: Date.now(),
                    text: journalInput,
                    amount: amount,
                    tags: tags,
                    date: `${new Date().getMonth()+1}/${new Date().getDate()}`
                };

                setData(p => {
                    const newState = { ...p, diaries: [newDiary, ...p.diaries] };
                    if (amount > 0) newState.assets -= amount;
                    
                    // 解任務
                    if (amount > 0 && !p.tasks.expense.done) {
                        newState.tasks.expense.done = true; gainRewards(20); showToast(`✨ 記帳任務完成！`);
                    } else if (!p.tasks.diary.done) {
                        newState.tasks.diary.done = true; gainRewards(30); showToast(`🌼 日記任務完成！`);
                    } else {
                        showToast(amount > 0 ? `💸 已自動記帳 $${amount}` : `📝 日記已儲存`);
                    }

                    // 更新標籤統計
                    tags.forEach(tag => {
                        newState.tagStats[tag] = (newState.tagStats[tag] || 0) + amount;
                    });

                    return newState;
                });
                setJournalInput('');
            };

            // 處理慾望冰塊 (解凍與轉換)
            const handleDefrost = (wishId) => {
                const wish = data.wishes.find(w => w.id === wishId);
                if (wish.frozen) {
                    // 解凍
                    setData(p => ({ ...p, wishes: p.wishes.map(w => w.id === wishId ? { ...w, frozen: false } : w) }));
                } else {
                    // 放棄購買，轉化為時光膠囊進度 (極致爽感動畫)
                    setAnimatingWishId(wishId);
                    
                    setTimeout(() => {
                        setData(p => {
                            const newCurrent = p.envelope.current + wish.cost;
                            if (newCurrent >= p.envelope.target && p.envelope.current < p.envelope.target) {
                                setTimeout(() => showToast('🔓 恭喜！時光膠囊解鎖了！'), 1000);
                            }
                            return {
                                ...p,
                                envelope: { ...p.envelope, current: Math.min(newCurrent, p.envelope.target) },
                                wishes: p.wishes.filter(w => w.id !== wishId)
                            };
                        });
                        setAnimatingWishId(null);
                        showToast(`✨ 成功克服衝動！$${wish.cost} 已注入歐洲旅行夢想！`);
                    }, 800); // 等待飛行結束
                }
            };

            const handlePayBill = (bill) => {
                setData(p => ({ ...p, assets: p.assets - bill.amount, bills: p.bills.filter(b => b.id !== bill.id) }));
                showToast(`✅ 已扣款：${bill.name} $${bill.amount}`);
            };

            // --- 畫面渲染 ---
            const renderTextWithTags = (text) => {
                return text.split(/(#\S+)/g).map((part, i) => part.startsWith('#') 
                    ? <span key={i} onClick={() => setTagModal(part.substring(1))} className="tag-pill mx-1">{part}</span> 
                    : <span key={i}>{part}</span>);
            };

            // 頁籤 1: 豬豬首頁 (雷達與儀式入口)
            const renderHomeView = () => (
                <div className="space-y-4 fade-in-up mt-4 pb-24">
                    <div className="flex justify-between items-center mb-6 px-2">
                        <div className="flex items-center space-x-3">
                            <div className="w-14 h-14 bg-white rounded-3xl shadow-sm flex items-center justify-center text-3xl border border-[#E8EBE9]">🐷</div>
                            <div>
                                <h1 className="text-xl font-black">Lv.{data.player.level} 豬豬</h1>
                                <div className="w-24 mt-1"><div className="exp-bar"><div className="exp-fill" style={{ width: `${(data.player.exp/data.player.maxExp)*100}%` }}></div></div></div>
                            </div>
                        </div>
                        {/* 月底結算按鈕 */}
                        <button onClick={() => setShowZine(true)} className="bg-[var(--text-dark)] text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md active:scale-95 transition-transform">
                            ✨ 月底雜誌
                        </button>
                    </div>

                    <div className="bento-card glow-warning">
                        <h3 className="font-bold text-lg flex items-center mb-4"><span className="text-2xl mr-2">📡</span> 防漏網雷達</h3>
                        <div className="space-y-3">
                            {data.bills.map((bill) => (
                                <div key={bill.id} className="bento-item bg-white shadow-sm border border-[#EED7A1] !p-4">
                                    <div className="flex justify-between items-start mb-2"><div><p className="font-bold text-[var(--text-dark)]">{bill.name}</p><p className="text-xs font-bold text-[#D98C8C] mt-0.5">{bill.daysLeft} 天後扣款</p></div><span className="font-black text-lg">${bill.amount}</span></div>
                                    <button onClick={() => handlePayBill(bill)} className="w-full bg-[#F4F5F3] text-[var(--text-dark)] text-xs font-bold py-3 rounded-xl mt-2 active:scale-95 transition-transform">✅ 已準備扣款</button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            // 頁籤 2: 記事與時光流 (自然語言輸入 + 標籤宇宙)
            const renderJournalView = () => (
                <div className="h-full flex flex-col pt-4">
                    <h2 className="text-2xl font-black mb-4 px-2">記事與時光流</h2>
                    
                    {/* 常用標籤雲 (點擊輸入) */}
                    <div className="bento-item bg-white shadow-sm mb-6 flex-shrink-0">
                        <p className="text-xs font-bold text-gray-400 mb-2">🏷️ 你的生活軌跡</p>
                        <div className="flex flex-wrap gap-2">
                            {Object.keys(data.tagStats).map(tag => (
                                <span key={tag} onClick={() => setTagModal(tag)} className="tag-pill">#{tag}</span>
                            ))}
                        </div>
                    </div>

                    {/* 時光流 (日記列表) */}
                    <div className="flex-1 overflow-y-auto space-y-4 pb-32">
                        {data.diaries.map(d => (
                            <div key={d.id} className="p-4 bg-white rounded-2xl shadow-sm border border-gray-100">
                                <p className="text-xs text-gray-400 mb-1">{d.date}</p>
                                <p className="font-bold leading-relaxed">{renderTextWithTags(d.text)}</p>
                            </div>
                        ))}
                    </div>

                    {/* 底部自然語言輸入框 */}
                    <div className="fixed bottom-24 left-0 w-full px-4 z-10">
                        <input 
                            value={journalInput} 
                            onChange={e=>setJournalInput(e.target.value)} 
                            onKeyPress={handleJournalSubmit}
                            className="natural-input" 
                            placeholder="輸入：去 #星巴克 花了 $150 ☕️ (按 Enter 送出)" 
                        />
                    </div>
                </div>
            );

            // 頁籤 3: 未來與願望清單
            const renderFutureView = () => {
                const env = data.envelope;
                const percent = Math.min(100, Math.floor((env.current / env.target) * 100));
                const isUnlocked = percent >= 100;

                return (
                    <div className="space-y-8 pt-4 pb-24 fade-in-up relative">
                        <h2 className="text-2xl font-black px-2">未來與願望</h2>
                        
                        {/* 時光膠囊 (磨砂信封) */}
                        <div className="glass-envelope h-56 flex flex-col items-center justify-center p-6 cursor-pointer active:scale-[0.98] transition-transform"
                             onClick={() => isUnlocked && alert(env.letter)}>
                            {/* 內部填充動畫 */}
                            <div className="envelope-fill" style={{ height: `${percent}%` }}></div>
                            
                            <div className="relative z-10 text-center">
                                <div className="text-5xl mb-3 drop-shadow-md">{isUnlocked ? '🔓' : '🔒'}</div>
                                <h3 className="font-black text-2xl text-[var(--text-dark)]">{env.title}</h3>
                                <p className="font-bold text-sm mt-2 bg-white/50 px-3 py-1 rounded-full inline-block backdrop-blur-sm">
                                    {isUnlocked ? '✨ 信件已解鎖，點擊查看' : `已儲存 ${percent}%`}
                                </p>
                            </div>
                        </div>

                        {/* 慾望停車場 */}
                        <div>
                            <div className="flex justify-between items-center mb-4 px-2">
                                <h3 className="font-bold text-lg">❄️ 慾望停車場</h3>
                                <span className="text-xs font-bold text-gray-500">防衝動機制</span>
                            </div>
                            <div className="space-y-4">
                                {data.wishes.map(wish => (
                                    <div key={wish.id} className="relative">
                                        {/* 飛行動畫的克隆體 */}
                                        {animatingWishId === wish.id && (
                                            <div className="absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center fly-anim">
                                                <span className="font-black text-2xl text-amber-500">+ ${wish.cost} 飛往夢想！</span>
                                            </div>
                                        )}
                                        
                                        <div className={`ice-card p-5 ${wish.frozen ? 'frozen' : 'ring-2 ring-green-300'}`}>
                                            <div className="flex justify-between items-start mb-2 relative z-10">
                                                <div>
                                                    <p className="font-black text-[var(--text-dark)] text-lg">{wish.name}</p>
                                                    <p className="text-xs font-bold text-gray-500 mt-1">理由：{wish.reason}</p>
                                                </div>
                                                <span className="font-black text-xl text-[var(--text-dark)]">${wish.cost}</span>
                                            </div>
                                            
                                            <div className="mt-4 relative z-10">
                                                {wish.frozen ? (
                                                    <button onClick={() => handleDefrost(wish.id)} className="w-full bg-white/80 backdrop-blur text-[var(--text-dark)] text-xs font-black py-3 rounded-xl shadow-sm border border-gray-200">
                                                        {wish.daysLeft > 0 ? `⏳ 冷卻中 (${wish.daysLeft}天)，點擊強制解凍` : `✨ 冷卻完畢！點擊解凍`}
                                                    </button>
                                                ) : (
                                                    <div className="flex space-x-2 animate-in fade-in">
                                                        <button onClick={() => handleDefrost(wish.id)} className="flex-1 bg-[var(--green-deep)] text-white text-xs font-black py-3 rounded-xl shadow-[0_4px_15px_rgba(74,124,89,0.3)] active:scale-95 transition-transform">
                                                            不買了 (轉存夢想)
                                                        </button>
                                                        <button onClick={() => alert('已購買')} className="flex-1 bg-gray-100 text-gray-500 text-xs font-black py-3 rounded-xl active:scale-95 transition-transform">
                                                            還是要買
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // 彈出視窗：標籤宇宙
            const renderTagModal = () => {
                if (!tagModal) return null;
                const total = data.tagStats[tagModal] || 0;
                const tagDiaries = data.diaries.filter(d => d.tags.includes(tagModal));

                return (
                    <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/30 backdrop-blur-md animate-in fade-in">
                        <div className="flex-1" onClick={() => setTagModal(null)}></div>
                        <div className="bg-white border-t border-gray-100 rounded-t-[40px] p-6 pb-12 shadow-2xl animate-in slide-in-from-bottom-full max-h-[85vh] overflow-y-auto">
                            <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
                            
                            <div className="text-center mb-8">
                                <h2 className="text-4xl font-black text-[var(--green-deep)] mb-2">#{tagModal}</h2>
                                <p className="text-sm font-bold text-gray-400">回憶與消費檢索</p>
                            </div>
                            
                            {/* 理性數據 */}
                            <div className="bg-amber-50 p-6 rounded-3xl mb-6 text-center border border-amber-100">
                                <p className="text-sm font-bold text-amber-800 mb-1">今年為此花費</p>
                                <p className="text-4xl font-black text-[var(--brown-dirt)]">${total.toLocaleString()}</p>
                            </div>
                            
                            {/* 感性故事 */}
                            <div>
                                <p className="font-bold text-lg mb-4">時光軌跡</p>
                                <div className="space-y-4">
                                    {tagDiaries.length === 0 ? <p className="text-sm text-gray-400">沒有相關紀錄</p> : tagDiaries.map(d => (
                                        <div key={d.id} className="bg-[#F9F6F0] p-4 rounded-2xl">
                                            <p className="text-xs text-gray-500 mb-2">{d.date}</p>
                                            <p className="font-bold leading-relaxed">{renderTextWithTags(d.text)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // 月底生活雜誌 Modal
            const renderZineModal = () => {
                if (!showZine) return null;
                return (
                    <div className="zine-modal flex flex-col">
                        {/* 封面 */}
                        <div className="zine-cover h-[60vh] relative flex flex-col justify-end p-8 text-white">
                            <button onClick={() => setShowZine(false)} className="absolute top-10 right-6 w-10 h-10 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center font-black">X</button>
                            <p className="text-sm font-bold tracking-widest mb-2 opacity-80">MONTHLY ZINE . VOL.10</p>
                            <h1 className="text-5xl font-black leading-tight mb-4">十月<br/>秋日的平靜<br/>與沉澱</h1>
                        </div>
                        {/* 內頁 */}
                        <div className="p-8 space-y-8 bg-[#FAF8F5] -mt-10 rounded-t-[40px] relative z-10 flex-1">
                            <div>
                                <h3 className="text-xl font-black mb-3">情緒與消費</h3>
                                <p className="text-sm leading-loose text-gray-600 font-bold">
                                    這個月你最常標註的心情是 <span className="text-[var(--green-deep)] text-lg">#平靜</span>，且成功在慾望停車場煞車了 3 次，省下了 <span className="text-amber-600 text-lg">$5,200</span>！<br/><br/>
                                    這些錢已經為你的歐洲之旅注入了龐大的能量。你做得非常棒，豬豬。
                                </p>
                            </div>
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                <p className="text-sm font-black text-center italic text-[var(--text-dark)] leading-relaxed">
                                    「果斷捨棄不再需要的衝動，就是對未來自己最大的慷慨。」
                                </p>
                            </div>
                            <button onClick={() => alert('已匯出精美長圖！')} className="w-full bg-[var(--text-dark)] text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">
                                📥 導出雜誌分享至 IG
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative bg-[var(--bg-cream)]">
                    {toastMsg && <div className="toast">{toastMsg}</div>}
                    
                    {/* 內容區 */}
                    <main className="max-w-md mx-auto px-4 pb-28 pt-4">
                        {activeTab === 'home' && renderHomeView()}
                        {activeTab === 'journal' && renderJournalView()}
                        {activeTab === 'future' && renderFutureView()}
                    </main>

                    {/* 底部導覽列 */}
                    <div className="fixed bottom-0 w-full z-40">
                        <nav className="bottom-nav pb-safe bg-white/90 backdrop-blur-md">
                            <div className="max-w-md mx-auto flex justify-around items-center px-4 py-3">
                                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center w-16 transition-transform ${activeTab==='home'?'scale-110 text-[var(--text-dark)]':'text-[var(--text-muted)] opacity-60'}`}>
                                    <span className="text-2xl mb-1">🐷</span><span className="text-[10px] font-black">首頁</span>
                                </button>
                                <button onClick={() => setActiveTab('journal')} className={`flex flex-col items-center w-16 transition-transform ${activeTab==='journal'?'scale-110 text-[var(--text-dark)]':'text-[var(--text-muted)] opacity-60'}`}>
                                    <span className="text-2xl mb-1">✍️</span><span className="text-[10px] font-black">時光流</span>
                                </button>
                                <button onClick={() => setActiveTab('future')} className={`flex flex-col items-center w-16 transition-transform ${activeTab==='future'?'scale-110 text-[var(--text-dark)]':'text-[var(--text-muted)] opacity-60'}`}>
                                    <span className="text-2xl mb-1">💌</span><span className="text-[10px] font-black">願望池</span>
                                </button>
                            </div>
                        </nav>
                    </div>

                    {renderTagModal()}
                    {renderZineModal()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
