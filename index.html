<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>豬豬記帳與存錢 App</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 載入 React, ReactDOM 與 Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏原生捲軸，讓介面更像 App */
    body { background-color: #FDFCF8; }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 彈出視窗動畫 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 自訂 Hook：用來將資料自動存入瀏覽器的 Local Storage
    const useLocalStorage = (key, initialValue) => {
      const [value, setValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          return initialValue;
        }
      });

      useEffect(() => {
        window.localStorage.setItem(key, JSON.stringify(value));
      }, [key, value]);

      return [value, setValue];
    };

    const App = () => {
      // 預設停在固定支出頁面方便檢查
      const [activeTab, setActiveTab] = useState('fixed'); 
      
      // --- 狀態資料 (已加入 Local Storage 儲存功能) ---
      
      // 1. 365存錢
      const [savedDays, setSavedDays] = useLocalStorage('piggy_saved_days', []);
      const savingsGoal = 66795;
      const currentSaved = savedDays.reduce((sum, day) => sum + day, 0);

      // 2. 固定支出 (加入了預設的 dueDate 期限欄位)
      const defaultFixed = [
        { id: 1, name: '房租', amount: 15000, isPaid: false, dueDate: '5' },
        { id: 2, name: '婷', amount: 30000, isPaid: false, dueDate: '10' },
        { id: 3, name: '美金', amount: 10000, isPaid: false, dueDate: '15' },
        { id: 4, name: '油錢', amount: 10000, isPaid: false, dueDate: '' },
        { id: 5, name: '汽車9900 摩托車600', amount: 10500, isPaid: false, dueDate: '' },
        { id: 6, name: '中信卡費', amount: 6000, isPaid: false, dueDate: '' },
        { id: 7, name: '媽', amount: 5000, isPaid: false, dueDate: '' },
        { id: 8, name: '3人健保', amount: 4956, isPaid: false, dueDate: '' },
        { id: 9, name: '摩托車800貨車4500', amount: 5300, isPaid: false, dueDate: '' },
        { id: 10, name: '婆婆保險', amount: 3000, isPaid: false, dueDate: '' },
        { id: 11, name: 'Q保費', amount: 3000, isPaid: false, dueDate: '' },
        { id: 12, name: '豬手機話費', amount: 3000, isPaid: false, dueDate: '' },
      ];
      const [fixedExpenses, setFixedExpenses] = useLocalStorage('piggy_fixed_expenses', defaultFixed);

      // 3. 每日花費 & 明細
      const floatingAssets = 152400;
      
      // 4. 股票投資
      const [stockRecords, setStockRecords] = useLocalStorage('piggy_stock_records', []);
      const [stockForm, setStockForm] = useState({ symbol: '', price: '', shares: '', fee: '' });

      const handleStockSubmit = (e) => {
        e.preventDefault();
        if (!stockForm.symbol || !stockForm.price || !stockForm.shares) return;
        
        const newRecord = {
          id: Date.now(),
          symbol: stockForm.symbol,
          price: Number(stockForm.price),
          shares: Number(stockForm.shares),
          fee: Number(stockForm.fee) || 0,
          date: new Date().toISOString().split('T')[0]
        };
        
        setStockRecords([newRecord, ...stockRecords]);
        setStockForm({ symbol: '', price: '', shares: '', fee: '' });
      };

      const removeStock = (id) => {
        if(window.confirm('確定要刪除這筆股票紀錄嗎？')) {
          setStockRecords(stockRecords.filter(record => record.id !== id));
        }
      };

      // --- 共用 Header ---
      const Header = () => (
        <div className="flex justify-between items-center p-5 bg-[#FDFCF8] sticky top-0 z-40 shadow-sm">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-3xl border border-gray-100">
              🐷
            </div>
            <div>
              <h1 className="font-bold text-gray-800 text-lg flex items-center gap-1">
                Lv.1 豬豬探索者 🌱
              </h1>
              <div className="h-1.5 w-32 bg-gray-200 rounded-full mt-1.5">
                <div className="h-full bg-gray-400 rounded-full w-1/5"></div>
              </div>
            </div>
          </div>
          <button className="bg-pink-100 text-pink-500 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm">
            <i className="fa-solid fa-screwdriver-wrench"></i> 救援
          </button>
        </div>
      );

      // --- 1. 365 存錢頁面 ---
      const RenderSavings = () => {
        const toggleDay = (day) => {
          if (savedDays.includes(day)) {
            setSavedDays(savedDays.filter(d => d !== day));
          } else {
            setSavedDays([...savedDays, day]);
          }
        };

        return (
          <div className="p-4 pb-24 space-y-4">
            <div className="bg-[#FFF4D2] rounded-3xl p-6 shadow-sm">
              <div className="text-[#A07043] font-bold text-sm mb-2 flex items-center gap-1">
                🎯 365天無痛存錢法
              </div>
              <div className="text-3xl font-black text-gray-800 mb-6">
                累計已存：${currentSaved.toLocaleString()}
              </div>
              <div className="flex justify-between text-xs font-bold text-[#A07043] mb-2">
                <span>目標：${savingsGoal.toLocaleString()}</span>
                <span>{Math.round((currentSaved / savingsGoal) * 100)}%</span>
              </div>
              <div className="h-3 w-full bg-[#F5E2A8] rounded-full overflow-hidden">
                <div 
                  className="h-full bg-[#E5B84B] rounded-full transition-all duration-500" 
                  style={{ width: `${Math.min(100, (currentSaved / savingsGoal) * 100)}%` }}
                ></div>
              </div>
            </div>

            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
              <h3 className="text-center font-bold text-gray-600 mb-4">每天選一個數字存錢並打卡吧！</h3>
              <div className="grid grid-cols-7 gap-2">
                {Array.from({ length: 365 }, (_, i) => i + 1).map(day => (
                  <button
                    key={day}
                    onClick={() => toggleDay(day)}
                    className={`aspect-square flex items-center justify-center rounded-xl font-bold text-[11px] sm:text-xs transition-colors
                      ${savedDays.includes(day) 
                        ? 'bg-[#E5B84B] text-white shadow-inner scale-95' 
                        : 'bg-gray-100 text-gray-400 hover:bg-gray-200'}`}
                  >
                    {day}
                  </button>
                ))}
              </div>
              <div className="text-center mt-6 text-gray-400 text-sm">
                （資料會自動儲存於此設備）
              </div>
            </div>
          </div>
        );
      };

      // --- 2. 固定支出頁面 (含編輯與期限功能) ---
      const RenderFixedExpenses = () => {
        // 編輯用的狀態
        const [showModal, setShowModal] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [formData, setFormData] = useState({ name: '', amount: '', dueDate: '' });

        const togglePaid = (id) => {
          setFixedExpenses(fixedExpenses.map(exp => 
            exp.id === id ? { ...exp, isPaid: !exp.isPaid } : exp
          ));
        };

        const resetAll = () => {
          if(window.confirm('確定要將所有固定支出重置為「未付」嗎？（通常在下個月初執行）')) {
            setFixedExpenses(fixedExpenses.map(exp => ({ ...exp, isPaid: false })));
          }
        };

        // 打開編輯視窗
        const openEditModal = (exp) => {
          setEditingId(exp.id);
          setFormData({ name: exp.name, amount: exp.amount, dueDate: exp.dueDate || '' });
          setShowModal(true);
        };

        // 打開新增視窗
        const openAddModal = () => {
          setEditingId(null);
          setFormData({ name: '', amount: '', dueDate: '' });
          setShowModal(true);
        };

        // 儲存支出 (新增或更新)
        const saveExpense = (e) => {
          e.preventDefault();
          if (!formData.name || !formData.amount) return;

          if (editingId) {
            // 更新舊有
            setFixedExpenses(fixedExpenses.map(exp =>
              exp.id === editingId 
                ? { ...exp, name: formData.name, amount: Number(formData.amount), dueDate: formData.dueDate } 
                : exp
            ));
          } else {
            // 新增
            const newExp = {
              id: Date.now(),
              name: formData.name,
              amount: Number(formData.amount),
              dueDate: formData.dueDate,
              isPaid: false
            };
            setFixedExpenses([...fixedExpenses, newExp]);
          }
          setShowModal(false);
        };

        // 刪除支出
        const deleteExpense = () => {
          if (window.confirm('確定要刪除這個支出項目嗎？')) {
            setFixedExpenses(fixedExpenses.filter(exp => exp.id !== editingId));
            setShowModal(false);
          }
        };

        return (
          <div className="p-4 pb-24 space-y-4">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-[#A07043] flex items-center gap-2">
                <i className="fa-solid fa-satellite-dish text-gray-600"></i> 固定支出雷達
              </h2>
              <button onClick={resetAll} className="bg-[#FFF4D2] text-[#A07043] px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm">
                <i className="fa-solid fa-rotate-right"></i> 每月重置
              </button>
            </div>
            
            <div className="bg-[#FFF4D2] text-[#A07043] p-3 rounded-xl text-sm font-bold text-center mb-4">
              點擊方塊內的打勾作「已付紀錄」，不扣除資產喔！
            </div>

            <div className="grid grid-cols-3 gap-3">
              {fixedExpenses.map(exp => (
                <div key={exp.id} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between relative group">
                  {/* 編輯按鈕 (小鉛筆) */}
                  <button 
                    onClick={() => openEditModal(exp)}
                    className="absolute top-2 right-2 text-gray-300 hover:text-[#A07043] p-1 rounded-full transition-colors z-10 bg-white shadow-[0_0_10px_white]"
                  >
                    <i className="fa-solid fa-pen text-[10px]"></i>
                  </button>

                  <div className="mb-2">
                    <div className="text-gray-600 font-bold text-sm mb-1 truncate pr-4" title={exp.name}>{exp.name}</div>
                    <div className="text-lg font-black text-gray-800">${exp.amount.toLocaleString()}</div>
                    
                    {/* 期限標籤 */}
                    <div className="h-4 mt-1">
                      {exp.dueDate && (
                        <span className="inline-block bg-[#FFF4D2] text-[#A07043] text-[9px] px-1.5 py-0.5 rounded-md font-bold">
                          期限: {exp.dueDate}號
                        </span>
                      )}
                    </div>
                  </div>

                  <button 
                    onClick={() => togglePaid(exp.id)}
                    className={`w-full py-1.5 rounded-lg text-xs font-bold flex justify-center items-center gap-1 transition-colors
                      ${exp.isPaid ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`}
                  >
                    {exp.isPaid ? '✅ 已付' : '⬜ 未付'}
                  </button>
                </div>
              ))}

              {/* 新增固定支出按鈕 */}
              <button 
                onClick={openAddModal}
                className="bg-gray-50 rounded-2xl p-3 border-2 border-dashed border-gray-200 flex flex-col items-center justify-center gap-2 text-gray-400 hover:bg-gray-100 transition-colors min-h-[120px]"
              >
                <i className="fa-solid fa-plus text-xl"></i>
                <span className="text-xs font-bold">新增支出</span>
              </button>
            </div>

            {/* 編輯/新增 Modal 視窗 */}
            {showModal && (
              <div className="fixed inset-0 bg-black/40 z-50 flex justify-center items-center p-4 animate-fade-in backdrop-blur-sm">
                <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-slide-up relative">
                  <button 
                    onClick={() => setShowModal(false)}
                    className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-gray-100 text-gray-500 rounded-full font-bold"
                  >
                    ✕
                  </button>
                  <h3 className="text-xl font-bold text-[#A07043] mb-4 flex items-center gap-2">
                    {editingId ? <i className="fa-solid fa-pen"></i> : <i className="fa-solid fa-plus"></i>}
                    {editingId ? '編輯固定支出' : '新增固定支出'}
                  </h3>
                  
                  <form onSubmit={saveExpense} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-500 mb-1">項目名稱</label>
                      <input 
                        type="text" 
                        required
                        placeholder="例如: 房租、電話費" 
                        className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#E5B84B]"
                        value={formData.name}
                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-500 mb-1">每月金額</label>
                      <input 
                        type="number" 
                        required
                        placeholder="例如: 15000" 
                        className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#E5B84B]"
                        value={formData.amount}
                        onChange={(e) => setFormData({...formData, amount: e.target.value})}
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-500 mb-1">最後繳費期限 (幾號) - 選填</label>
                      <input 
                        type="number"
                        min="1" max="31"
                        placeholder="例如: 5" 
                        className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#E5B84B]"
                        value={formData.dueDate}
                        onChange={(e) => setFormData({...formData, dueDate: e.target.value})}
                      />
                      <p className="text-[10px] text-gray-400 mt-1 pl-1">只需填寫數字，例如 5 號就填 5。</p>
                    </div>
                    
                    <div className="pt-4 flex gap-3">
                      {editingId && (
                        <button 
                          type="button"
                          onClick={deleteExpense}
                          className="flex-1 bg-red-50 text-red-500 font-bold py-3 rounded-xl hover:bg-red-100 transition-colors"
                        >
                          刪除
                        </button>
                      )}
                      <button 
                        type="submit" 
                        className={`font-bold py-3 rounded-xl transition-colors ${editingId ? 'flex-[2]' : 'w-full'} bg-[#A07043] text-white hover:bg-[#8A5E35] shadow-md`}
                      >
                        {editingId ? '儲存變更' : '新增至雷達'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      };

      // --- 3. 每日花費頁面 ---
      const RenderDaily = () => {
        return (
          <div className="p-4 pb-24 space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 relative">
                <i className="fa-solid fa-gear absolute top-4 right-4 text-gray-400 text-sm"></i>
                <div className="text-gray-500 font-bold text-sm mb-1">現有浮動資產</div>
                <div className="text-2xl font-black text-[#5B7B61]">${floatingAssets.toLocaleString()}</div>
              </div>
              <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 relative">
                <div className="absolute top-4 right-4 bg-pink-100 text-pink-500 text-[10px] px-2 py-0.5 rounded font-bold">歸零</div>
                <div className="text-gray-500 font-bold text-sm mb-1 flex items-center gap-1">本月累計支出 📉</div>
                <div className="text-2xl font-black text-[#C69C6D]">$0</div>
              </div>
            </div>

            <div className="flex justify-between items-center mt-6 mb-2">
              <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                ✍️ 快速記開銷
              </h2>
              <button className="bg-gray-100 text-gray-500 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1">
                <i className="fa-solid fa-gear"></i> 編輯標籤
              </button>
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-6">
              <div className="flex bg-gray-100 rounded-xl p-1">
                <button className="flex-1 bg-white shadow-sm rounded-lg py-2 font-bold text-gray-800">支出</button>
                <button className="flex-1 rounded-lg py-2 font-bold text-gray-400">收入</button>
              </div>

              <div>
                <div className="text-gray-500 text-sm font-bold mb-3">選擇分類：</div>
                <div className="grid grid-cols-4 gap-4">
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-14 h-14 rounded-full border-2 border-gray-800 flex items-center justify-center text-2xl bg-orange-50 shadow-sm">🍔</div>
                    <span className="text-xs font-bold text-gray-800">餐飲</span>
                  </div>
                  <div className="flex flex-col items-center gap-2 opacity-50">
                    <div className="w-14 h-14 rounded-full bg-pink-50 flex items-center justify-center text-2xl">🛍️</div>
                    <span className="text-xs font-bold text-gray-500">購物</span>
                  </div>
                  <div className="flex flex-col items-center gap-2 opacity-50">
                    <div className="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center text-2xl">🚗</div>
                    <span className="text-xs font-bold text-gray-500">交通</span>
                  </div>
                  <div className="flex flex-col items-center gap-2 opacity-50">
                    <div className="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center text-2xl">🏠</div>
                    <span className="text-xs font-bold text-gray-500">生活</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center justify-between bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <div className="flex items-center gap-2 text-gray-500 font-bold text-sm">
                  <i className="fa-regular fa-calendar"></i> 記帳日期
                </div>
                <div className="font-black text-gray-800 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100">
                  今天
                </div>
              </div>
            </div>
          </div>
        );
      };

      // --- 4. 明細日曆頁面 ---
      const RenderCalendar = () => {
        return (
          <div className="p-4 pb-24 space-y-4">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl font-black text-[#4A4A7A]">日曆帳本</h2>
              <div className="flex items-center gap-4 bg-[#EEEDF6] text-[#4A4A7A] px-4 py-2 rounded-full font-bold">
                <i className="fa-solid fa-chevron-left text-sm"></i>
                <span>本月</span>
                <i className="fa-solid fa-chevron-right text-sm"></i>
              </div>
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
              <div className="grid grid-cols-7 text-center text-xs font-bold text-gray-400 mb-4">
                <div>週一</div><div>週二</div><div>週三</div><div>週四</div>
                <div>週五</div><div>週六</div><div>週日</div>
              </div>
              <div className="grid grid-cols-7 text-center gap-y-4 text-sm font-bold text-gray-600">
                <div className="opacity-0"></div><div className="opacity-0"></div>
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div>
                <div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div>
                <div>13</div><div>14</div><div>15</div><div>16</div><div>17</div><div>18</div><div>19</div>
                <div>20</div><div>21</div><div>22</div><div>23</div><div>24</div>
                <div className="bg-[#6366F1] text-white w-8 h-8 flex items-center justify-center rounded-xl mx-auto shadow-md">25</div>
                <div>26</div>
                <div>27</div><div>28</div><div>29</div><div>30</div><div>31</div>
              </div>
            </div>
          </div>
        );
      };

      // --- 5. 股票投資頁面 ---
      const RenderStocks = () => {
        const totalInvested = stockRecords.reduce((sum, record) => sum + (record.price * record.shares + record.fee), 0);

        return (
          <div className="p-4 pb-24 space-y-4">
            <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-6 shadow-md text-white relative overflow-hidden">
              <div className="absolute -right-4 -top-4 opacity-10">
                <i className="fa-solid fa-chart-line text-9xl"></i>
              </div>
              <div className="text-indigo-100 font-bold text-sm mb-1 flex items-center gap-2 relative z-10">
                <i className="fa-solid fa-chart-pie"></i> 股票庫存總成本
              </div>
              <div className="text-3xl font-black mb-4 relative z-10">
                ${totalInvested.toLocaleString()}
              </div>
              <p className="text-xs text-indigo-100 opacity-80 relative z-10">
                * 包含手續費的實際投入成本
              </p>
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
              <h2 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i className="fa-solid fa-circle-plus text-indigo-500 text-lg"></i> 新增買進紀錄
              </h2>
              <form onSubmit={handleStockSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">股票代號/名稱</label>
                  <input 
                    type="text" 
                    required
                    placeholder="例如: 2330 台積電" 
                    className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    value={stockForm.symbol}
                    onChange={(e) => setStockForm({...stockForm, symbol: e.target.value})}
                  />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">成交價</label>
                    <input 
                      type="number"
                      step="any" 
                      required
                      placeholder="0.00" 
                      className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      value={stockForm.price}
                      onChange={(e) => setStockForm({...stockForm, price: e.target.value})}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">股數</label>
                    <input 
                      type="number" 
                      required
                      placeholder="1000" 
                      className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      value={stockForm.shares}
                      onChange={(e) => setStockForm({...stockForm, shares: e.target.value})}
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 mb-1">手續費 (選填)</label>
                  <input 
                    type="number" 
                    placeholder="20" 
                    className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    value={stockForm.fee}
                    onChange={(e) => setStockForm({...stockForm, fee: e.target.value})}
                  />
                </div>
                <button 
                  type="submit" 
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors shadow-sm"
                >
                  計算並加入庫存
                </button>
              </form>
            </div>

            <div className="mt-6">
              <h3 className="font-bold text-gray-600 mb-3">持有明細</h3>
              <div className="space-y-3">
                {stockRecords.length === 0 && (
                  <div className="text-center text-gray-400 text-sm py-8 bg-white rounded-3xl border border-gray-100">
                    尚無股票紀錄，趕快新增第一筆吧！
                  </div>
                )}
                {stockRecords.map(record => {
                  const cost = (record.price * record.shares) + record.fee;
                  const avgPrice = cost / record.shares;
                  
                  return (
                    <div key={record.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-2 relative">
                      <button 
                        onClick={() => removeStock(record.id)}
                        className="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors"
                      >
                        <i className="fa-solid fa-trash-can"></i>
                      </button>
                      <div className="flex justify-between items-center pr-6">
                        <span className="font-bold text-gray-800 text-lg">{record.symbol}</span>
                        <span className="text-xs text-gray-400">{record.date}</span>
                      </div>
                      <div className="grid grid-cols-3 gap-2 mt-2">
                        <div className="bg-gray-50 p-2 rounded-lg text-center">
                          <div className="text-[10px] text-gray-500 font-bold mb-1">股數</div>
                          <div className="font-black text-gray-700 text-sm">{record.shares}</div>
                        </div>
                        <div className="bg-gray-50 p-2 rounded-lg text-center">
                          <div className="text-[10px] text-gray-500 font-bold mb-1">均價(含息)</div>
                          <div className="font-black text-indigo-600 text-sm">{avgPrice.toFixed(2)}</div>
                        </div>
                        <div className="bg-gray-50 p-2 rounded-lg text-center">
                          <div className="text-[10px] text-gray-500 font-bold mb-1">總成本</div>
                          <div className="font-black text-gray-800 text-sm">${cost.toLocaleString()}</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      // --- 底部導航列 ---
      const BottomNav = () => {
        const navItems = [
          { id: 'savings', icon: 'fa-campground', label: '365存錢' },
          { id: 'fixed', icon: 'fa-satellite-dish', label: '固定支出' },
          { id: 'daily', icon: 'fa-wallet', label: '每日花費' },
          { id: 'calendar', icon: 'fa-calendar', label: '明細日曆' },
          { id: 'stocks', icon: 'fa-chart-line', label: '股票投資' },
        ];

        return (
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-50">
            <div className="w-full max-w-md mx-auto flex justify-around">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center w-[20%] py-1 gap-1 transition-colors
                    ${activeTab === item.id ? 'text-gray-800' : 'text-gray-300'}`}
                >
                  <i className={`fa-solid ${item.icon} text-xl mb-0.5 ${activeTab === item.id ? 'opacity-80' : 'opacity-50'}`}></i>
                  <span className={`text-[10px] font-bold ${activeTab === item.id ? 'text-gray-800' : 'text-gray-400'}`}>
                    {item.label}
                  </span>
                </button>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="bg-[#FDFCF8] min-h-screen font-sans text-gray-800">
          <div className="max-w-md mx-auto bg-[#FDFCF8] min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
            <Header />
            <main className="flex-1 overflow-y-auto custom-scrollbar">
              {activeTab === 'savings' && <RenderSavings />}
              {activeTab === 'fixed' && <RenderFixedExpenses />}
              {activeTab === 'daily' && <RenderDaily />}
              {activeTab === 'calendar' && <RenderCalendar />}
              {activeTab === 'stocks' && <RenderStocks />}
            </main>
            <BottomNav />
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
