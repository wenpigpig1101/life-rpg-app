<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生活冒險家 - 晨間簡報</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* --- 基礎設定 & 莫蘭迪色系 --- */
        :root {
            --bg-cream: #F9F6F0;      /* 背景奶油白 */
            --card-white: #FFFFFF;    /* 卡片純白 */
            --text-dark: #2C3E35;     /* 深墨綠文字 */
            --text-muted: #8A9A90;    /* 淺灰綠文字 */
            --green-deep: #4A7C59;    /* 深綠 */
            --green-soft: #A3B899;    /* 淺綠 */
            --yellow-warm: #EED7A1;   /* 溫暖黃 */
            --red-soft: #D98C8C;      /* 柔和紅 (警示) */
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { display: none; }

        /* 卡片共用設定 */
        .briefing-card {
            background-color: var(--card-white);
            border-radius: 32px;
            box-shadow: 0 12px 32px rgba(44, 62, 53, 0.05), 0 2px 8px rgba(44, 62, 53, 0.02);
            border: 1px solid rgba(163, 184, 153, 0.15);
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 警告光暈 (用於 Radar Card) */
        .glow-warning {
            box-shadow: 0 0 40px rgba(238, 215, 161, 0.4), inset 0 0 20px rgba(238, 215, 161, 0.2);
            border: 1px solid rgba(238, 215, 161, 0.5);
        }

        /* Bento 網格小方塊 */
        .bento-item {
            background: #F4F5F3;
            border-radius: 24px;
            padding: 16px;
        }

        /* 按鈕樣式 */
        .btn-primary {
            background-color: var(--text-dark);
            color: var(--bg-cream);
            border-radius: 20px;
            padding: 16px;
            font-weight: bold;
            transition: transform 0.15s, opacity 0.15s;
            text-align: center;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { opacity: 0.5; transform: none; }

        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid var(--text-muted);
            border-radius: 20px;
            padding: 12px;
            font-weight: bold;
            transition: transform 0.15s;
            text-align: center;
        }
        .btn-outline:active { transform: scale(0.96); background-color: rgba(138, 154, 144, 0.1); }

        /* 動畫 */
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast 提示 */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-dark); color: white;
            padding: 12px 24px; border-radius: 999px;
            font-weight: bold; font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 100;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.3s 2.7s forwards;
        }
        @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 模擬資料庫 ---
        const USER_STATE = {
            status: 'overspent', // 昨天狀態：'overspent' (超支), 'good' (健康), 'sad' (心情低落)
            budget: 30000,
            spent: 12500,
            fixedRatio: 40,
            topCategory: '餐飲美食',
        };

        const INITIAL_BILLS = [
            { id: 'b1', name: 'Netflix 訂閱', amount: 390, daysLeft: 3, type: 'sub' },
            { id: 'b2', name: '六月份手機費', amount: 799, daysLeft: 5, type: 'bill' },
            { id: 'b3', name: '投資定期定額', amount: 5000, daysLeft: 12, type: 'invest' },
        ];

        // 根據狀態生成的動態金句
        const getQuote = (status) => {
            if (status === 'overspent') return "不要為打翻的牛奶哭泣，也不要為昨日的花費焦慮。\n今天，又是能重新掌握自己的一天。";
            if (status === 'sad') return "允許自己偶爾停下腳步。\n今天的預算很充足，去買杯好咖啡安慰自己吧。";
            return "你的生活節奏無比優雅。\n繼續保持這份從容，讓今天的自己也閃閃發光。";
        };

        function App() {
            // --- 狀態管理 ---
            const [currentCard, setCurrentCard] = useState(0);
            const [bills, setBills] = useState(INITIAL_BILLS);
            const [taskCompleted, setTaskCompleted] = useState(false);
            const [toastMsg, setToastMsg] = useState(null);
            
            // 滑動手勢相關 (Swipe)
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);
            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;

                if (isLeftSwipe && currentCard < 2) setCurrentCard(prev => prev + 1);
                if (isRightSwipe && currentCard > 0) setCurrentCard(prev => prev - 1);
            };

            // 顯示 Toast 提示
            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3000);
            };

            // --- 互動邏輯 ---
            const handleCancelSub = (bill) => {
                setBills(prev => prev.filter(b => b.id !== bill.id));
                showToast(`✨ 果斷捨棄！已取消訂閱並回收虛擬收入 $${bill.amount}`);
            };

            const handlePayBill = (bill) => {
                setBills(prev => prev.filter(b => b.id !== bill.id));
                showToast(`✅ 已確認準備扣款：${bill.name}`);
            };

            const handleCompleteTask = () => {
                setTaskCompleted(true);
                showToast("🎉 任務完成！獲得新金句卡片一張");
                setTimeout(() => {
                    if (currentCard < 2) setCurrentCard(2); // 自動跳轉下一張
                }, 1000);
            };

            // --- 日期格式化 ---
            const today = new Date();
            const dateString = `${today.getMonth() + 1}月${today.getDate()}日`;
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayString = days[today.getDay()];

            // --- 卡片渲染 ---

            // 🃏 卡片一：今日心靈與狀態 (The Soul Card)
            const renderSoulCard = () => (
                <div className="briefing-card p-8 flex flex-col justify-between" style={{ minWidth: '100%' }}>
                    <div className="fade-in-up" style={{ animationDelay: '0.1s' }}>
                        <div className="flex items-center space-x-2 mb-2 text-[var(--text-muted)] font-bold">
                            <span className="text-xl">🌤️</span>
                            <span>{dateString} · {dayString}</span>
                        </div>
                        <div className="w-10 h-1 bg-[var(--green-soft)] rounded-full mt-4"></div>
                    </div>

                    <div className="flex-1 flex flex-col justify-center fade-in-up" style={{ animationDelay: '0.3s' }}>
                        <h2 className="text-2xl font-black leading-relaxed tracking-wide text-[var(--text-dark)] whitespace-pre-line">
                            {getQuote(USER_STATE.status)}
                        </h2>
                    </div>

                    <div className="text-center fade-in-up" style={{ animationDelay: '0.5s' }}>
                        <p className="text-xs font-bold text-[var(--text-muted)] flex items-center justify-center animate-pulse">
                            向左滑動開始晨間簡報 <span className="ml-2">→</span>
                        </p>
                    </div>
                </div>
            );

            // 🃏 卡片二：財務儀表板與月統計 (The Compass Card)
            const renderCompassCard = () => {
                const available = USER_STATE.budget - USER_STATE.spent;
                const percent = (USER_STATE.spent / USER_STATE.budget) * 100;
                const isTight = percent > 80;

                return (
                    <div className="briefing-card p-6" style={{ minWidth: '100%' }}>
                        <h3 className="font-bold text-lg mb-6 flex items-center">
                            <span className="text-2xl mr-2">🧭</span> 財務儀表板
                        </h3>

                        <div className="grid grid-cols-2 gap-3 flex-1">
                            {/* 大模組：可用餘額 */}
                            <div className="bento-item col-span-2 bg-white border border-[rgba(163,184,153,0.2)] shadow-sm">
                                <p className="text-sm font-bold text-[var(--text-muted)] mb-1">本月剩餘預算</p>
                                <h1 className="text-4xl font-black mb-4">${available.toLocaleString()}</h1>
                                
                                <div className="h-3 bg-[#E8EBE9] rounded-full overflow-hidden">
                                    <div 
                                        className={`h-full rounded-full transition-all duration-1000 ${isTight ? 'bg-[var(--yellow-warm)]' : 'bg-[var(--green-deep)]'}`}
                                        style={{ width: `${percent}%` }}
                                    ></div>
                                </div>
                                <div className="flex justify-between text-[10px] font-bold mt-2 text-[var(--text-muted)]">
                                    <span>已花費 ${USER_STATE.spent.toLocaleString()}</span>
                                    <span>總預算 ${USER_STATE.budget.toLocaleString()}</span>
                                </div>
                            </div>

                            {/* 小模組 1：固定支出 */}
                            <div className="bento-item flex flex-col justify-center">
                                <span className="text-2xl mb-2">🏛️</span>
                                <p className="text-[11px] font-bold text-[var(--text-muted)]">固定支出佔比</p>
                                <p className="text-xl font-black mt-1">{USER_STATE.fixedRatio}%</p>
                                <p className="text-[10px] text-[var(--text-muted)] mt-1 font-bold">生活基石穩固</p>
                            </div>

                            {/* 小模組 2：花費之最 */}
                            <div className="bento-item flex flex-col justify-center">
                                <span className="text-2xl mb-2">🍽️</span>
                                <p className="text-[11px] font-bold text-[var(--text-muted)]">本月支出之最</p>
                                <p className="text-xl font-black mt-1 text-[var(--green-deep)]">{USER_STATE.topCategory}</p>
                            </div>
                        </div>

                        {/* 互動任務 */}
                        <div className="mt-6">
                            <button 
                                onClick={handleCompleteTask}
                                disabled={taskCompleted}
                                className="btn-primary w-full flex items-center justify-center space-x-2"
                            >
                                <span>{taskCompleted ? '✅ 檢視完成' : '今日任務：確認財務狀態'}</span>
                            </button>
                        </div>
                    </div>
                );
            };

            // 🃏 卡片三：防漏網與即將到期 (The Radar Card)
            const renderRadarCard = () => (
                <div className="briefing-card glow-warning p-6" style={{ minWidth: '100%' }}>
                    <div className="mb-6 flex justify-between items-start">
                        <div>
                            <h3 className="font-bold text-lg flex items-center">
                                <span className="text-2xl mr-2">📡</span> 防漏網雷達
                            </h3>
                            <p className="text-xs font-bold text-[var(--text-muted)] mt-1">
                                {bills.length > 0 ? "有幾筆即將到期的款項需要確認" : "本月雷達清空，一切安全！"}
                            </p>
                        </div>
                        <div className="w-10 h-10 bg-[var(--yellow-warm)] rounded-full flex items-center justify-center opacity-40 animate-pulse">
                            ⚠️
                        </div>
                    </div>

                    <div className="flex-1 space-y-4 overflow-y-auto pr-2 pb-10">
                        {bills.length === 0 && (
                            <div className="h-full flex flex-col items-center justify-center text-[var(--text-muted)] opacity-50">
                                <span className="text-4xl mb-2">🌿</span>
                                <p className="font-bold">沒有即將到期的帳單</p>
                            </div>
                        )}

                        {bills.map((bill, idx) => (
                            <div key={bill.id} className="bento-item bg-white border border-[#EED7A1] shadow-sm fade-in-up" style={{ animationDelay: `${idx * 0.1}s` }}>
                                <div className="flex justify-between items-start mb-3">
                                    <div>
                                        <p className="font-bold text-[var(--text-dark)]">{bill.name}</p>
                                        <p className="text-xs font-bold text-[#D98C8C]">距離扣款還有 {bill.daysLeft} 天</p>
                                    </div>
                                    <span className="font-black text-lg">${bill.amount}</span>
                                </div>
                                
                                <div className="flex space-x-2 mt-4">
                                    <button 
                                        onClick={() => handlePayBill(bill)}
                                        className="flex-1 bg-[#F4F5F3] text-[var(--text-dark)] text-xs font-bold py-2.5 rounded-xl transition-transform active:scale-95"
                                    >
                                        已準備好扣款
                                    </button>
                                    {bill.type === 'sub' && (
                                        <button 
                                            onClick={() => handleCancelSub(bill)}
                                            className="flex-1 bg-[var(--red-soft)] text-white text-xs font-bold py-2.5 rounded-xl transition-transform active:scale-95 shadow-[0_4px_10px_rgba(217,140,140,0.3)]"
                                        >
                                            我想取消訂閱
                                        </button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    {/* 結束簡報按鈕 (若在最後一頁才顯示亮色) */}
                    <button onClick={() => showToast("✨ 晨間簡報完成，開始美好的一天！")} className="btn-primary w-full mt-4 bg-[var(--green-deep)]">
                        完成簡報，進入首頁
                    </button>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col items-center justify-center py-10 px-4">
                    {/* Toast 提示元件 */}
                    {toastMsg && <div className="toast">{toastMsg}</div>}

                    {/* 頂部導航點 (Carousel Indicators) */}
                    <div className="flex space-x-2 mb-6">
                        {[0, 1, 2].map(idx => (
                            <div 
                                key={idx} 
                                className={`h-2 rounded-full transition-all duration-300 ${currentCard === idx ? 'w-8 bg-[var(--text-dark)]' : 'w-2 bg-[var(--text-muted)] opacity-30'}`}
                            ></div>
                        ))}
                    </div>

                    {/* 滑動卡片容器 */}
                    <div 
                        className="w-full max-w-md h-[600px] relative overflow-hidden rounded-[32px]"
                        onTouchStart={onTouchStart}
                        onTouchMove={onTouchMove}
                        onTouchEnd={onTouchEnd}
                    >
                        {/* 內部軌道 (透過 transform 實現滑動) */}
                        <div 
                            className="flex h-full transition-transform duration-500 ease-out"
                            style={{ transform: `translateX(-${currentCard * 100}%)` }}
                        >
                            {renderSoulCard()}
                            {renderCompassCard()}
                            {renderRadarCard()}
                        </div>
                    </div>

                    {/* 給桌機版測試用的左右按鈕 (隱藏於手機端，方便在電腦上點擊) */}
                    <div className="hidden md:flex space-x-4 mt-8">
                        <button onClick={() => setCurrentCard(p => Math.max(0, p-1))} className="btn-outline px-6 py-2">← 上一張</button>
                        <button onClick={() => setCurrentCard(p => Math.min(2, p+1))} className="btn-outline px-6 py-2">下一張 →</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
