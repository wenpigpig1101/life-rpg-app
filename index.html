<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生活冒險家 - 療癒記帳</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* --- 基礎設定 & 莫蘭迪色系 --- */
        :root {
            --bg-cream: #F9F6F0;      /* 背景奶油白 */
            --card-white: #FFFFFF;    /* 卡片純白 */
            --text-dark: #2C3E35;     /* 深墨綠文字 */
            --text-muted: #8A9A90;    /* 淺灰綠文字 */
            --green-deep: #4A7C59;    /* 深綠 */
            --green-soft: #A3B899;    /* 淺綠 */
            --brown-dirt: #D4A373;    /* 泥土/食物色 */
            --red-soft: #D98C8C;      /* 柔和紅/購物色 */
            --water-blue: #A8C4D9;    /* 水波紋/交通色 */
            --yellow-sun: #EED7A1;    /* 陽光經驗值 */
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        ::-webkit-scrollbar { display: none; }

        /* --- Bento Box 卡片 --- */
        .bento-card {
            background-color: var(--card-white);
            border-radius: 32px;
            box-shadow: 0 8px 24px rgba(74, 124, 89, 0.04), 0 2px 8px rgba(74, 124, 89, 0.02);
            border: 1px solid rgba(163, 184, 153, 0.15);
            padding: 24px;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }

        /* --- 動態水位 --- */
        .water-container {
            position: absolute; bottom: 0; left: 0; right: 0; height: 120px; z-index: 0; pointer-events: none;
        }
        .wave {
            position: absolute; bottom: -50px; left: -50%; width: 200%; height: 200px;
            background-color: var(--water-blue); border-radius: 40%; opacity: 0.3;
            animation: drift 7s infinite linear;
        }
        .wave:nth-child(2) { bottom: -60px; left: -40%; background-color: #82A8C7; animation: drift 9s infinite linear reverse; opacity: 0.4; }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- 任務打勾動畫 --- */
        .task-checkbox {
            width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .task-done {
            background-color: var(--green-deep); border-color: var(--green-deep);
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { 0% { transform: scale(0.8); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- 經驗值進度條 --- */
        .exp-bar { height: 8px; background-color: #E8EBE9; border-radius: 999px; overflow: hidden; }
        .exp-fill { height: 100%; background-color: var(--yellow-sun); transition: width 0.5s ease-out; }

        /* --- 統計進度條 --- */
        .stat-bar { height: 10px; background-color: #E8EBE9; border-radius: 999px; overflow: hidden; }
        .stat-fill { height: 100%; border-radius: 999px; transition: width 1s ease-out; }

        /* --- 底部選單 --- */
        .fab-btn {
            background-color: var(--text-dark); color: var(--bg-cream); border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 16px rgba(44, 62, 53, 0.2); transition: transform 0.15s;
        }
        .fab-btn:active { transform: scale(0.92); }
        .bottom-sheet {
            background: var(--card-white); border-top-left-radius: 40px; border-top-right-radius: 40px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); max-height: 85vh; overflow-y: auto;
        }
        .input-eco {
            background: #F4F5F3; border: 2px solid transparent; border-radius: 20px; padding: 16px 20px; width: 100%;
            color: var(--text-dark); font-weight: bold; outline: none; transition: 0.2s;
        }
        .input-eco:focus { border-color: var(--green-soft); background: #fff; box-shadow: 0 4px 12px rgba(163, 184, 153, 0.15); }

        /* Toast 提示 */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text-dark); color: white; padding: 12px 24px; border-radius: 999px;
            font-weight: bold; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 100;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.3s 2.7s forwards;
            display: flex; align-items: center; white-space: nowrap;
        }
        @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 模擬資料與初始狀態 ---
        const INITIAL_STATE = {
            // 玩家狀態 (RPG 元素)
            player: { level: 1, exp: 40, maxExp: 100 },
            assets: 52400,
            
            // 每日任務
            tasks: {
                expense: { title: '記錄一筆開銷', done: false, rewardExp: 20, rewardMoney: 50 },
                diary: { title: '寫下今日日記', done: false, rewardExp: 30, rewardMoney: 100 },
            },

            // 本月花費明細 (用於統計)
            expenses: [
                { id: 1, amount: 4500, category: 'food', date: '2023-10-01' },
                { id: 2, amount: 2100, category: 'shopping', date: '2023-10-05' },
                { id: 3, amount: 850, category: 'transport', date: '2023-10-10' },
                { id: 4, amount: 1200, category: 'life', date: '2023-10-12' },
                { id: 5, amount: 350, category: 'food', date: '2023-10-20' },
            ]
        };

        const CATEGORY_CONFIG = {
            food: { label: '🍔 餐飲美食', color: 'var(--brown-dirt)' },
            shopping: { label: '🛍️ 購物治裝', color: 'var(--red-soft)' },
            transport: { label: '🚗 交通出行', color: 'var(--water-blue)' },
            life: { label: '🏠 生活雜項', color: 'var(--green-soft)' }
        };

        function App() {
            const [data, setData] = useState(INITIAL_STATE);
            const [showActionMenu, setShowActionMenu] = useState(false);
            const [activeForm, setActiveForm] = useState(null);
            const [toastMsg, setToastMsg] = useState(null);
            
            // 表單暫存
            const [tempAmount, setTempAmount] = useState('');
            const [tempCategory, setTempCategory] = useState('food');
            const [tempText, setTempText] = useState('');

            // --- 提示與升級系統 ---
            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3000);
            };

            const gainRewards = (exp, money) => {
                setData(prev => {
                    let newExp = prev.player.exp + exp;
                    let newLevel = prev.player.level;
                    let newMaxExp = prev.player.maxExp;
                    
                    if (newExp >= newMaxExp) {
                        newExp -= newMaxExp;
                        newLevel += 1;
                        newMaxExp = Math.floor(newMaxExp * 1.5);
                        setTimeout(() => showToast(`🎉 升級了！成為 Lv.${newLevel} 園丁！`), 800);
                    }

                    return {
                        ...prev,
                        assets: prev.assets + money,
                        player: { level: newLevel, exp: newExp, maxExp: newMaxExp }
                    };
                });
            };

            // --- 互動邏輯 ---
            const handleRecordExpense = () => {
                if (!tempAmount) return;
                const amount = parseInt(tempAmount);
                
                const newExpense = {
                    id: Date.now(),
                    amount: amount,
                    category: tempCategory,
                    date: new Date().toISOString()
                };

                setData(prev => {
                    const newState = {
                        ...prev,
                        assets: prev.assets - amount,
                        expenses: [...prev.expenses, newExpense]
                    };

                    // 檢查解任務
                    if (!prev.tasks.expense.done) {
                        newState.tasks = { ...prev.tasks, expense: { ...prev.tasks.expense, done: true } };
                        setTimeout(() => {
                            gainRewards(prev.tasks.expense.rewardExp, prev.tasks.expense.rewardMoney);
                            showToast(`✨ 任務完成！獲得 ☀️${prev.tasks.expense.rewardExp} 💧${prev.tasks.expense.rewardMoney}`);
                        }, 300);
                    } else {
                        showToast(`💸 成功紀錄花費 $${amount}`);
                    }
                    return newState;
                });
                
                setTempAmount(''); setActiveForm(null); setShowActionMenu(false);
            };

            const handleRecordDiary = () => {
                if (!tempText) return;
                
                setData(prev => {
                    const newState = { ...prev };
                    if (!prev.tasks.diary.done) {
                        newState.tasks = { ...prev.tasks, diary: { ...prev.tasks.diary, done: true } };
                        setTimeout(() => {
                            gainRewards(prev.tasks.diary.rewardExp, prev.tasks.diary.rewardMoney);
                            showToast(`🌼 日記完成！獲得 ☀️${prev.tasks.diary.rewardExp} 💧${prev.tasks.diary.rewardMoney}`);
                        }, 300);
                    } else {
                        showToast(`📝 日記已更新`);
                    }
                    return newState;
                });
                
                setTempText(''); setActiveForm(null); setShowActionMenu(false);
            };

            // --- 計算收支統計 ---
            const calculateStats = () => {
                let total = 0;
                const summary = { food: 0, shopping: 0, transport: 0, life: 0 };
                
                data.expenses.forEach(exp => {
                    if (summary[exp.category] !== undefined) {
                        summary[exp.category] += exp.amount;
                        total += exp.amount;
                    }
                });

                // 轉換為陣列並排序
                const sortedStats = Object.keys(summary)
                    .map(key => ({
                        key,
                        amount: summary[key],
                        percent: total === 0 ? 0 : Math.round((summary[key] / total) * 100),
                        ...CATEGORY_CONFIG[key]
                    }))
                    .sort((a, b) => b.amount - a.amount);

                return { total, stats: sortedStats };
            };

            // --- UI 渲染 ---

            // 1. 玩家狀態與資產 (Header)
            const renderProfile = () => {
                const percent = (data.player.exp / data.player.maxExp) * 100;
                return (
                    <header className="px-5 pt-8 pb-4 flex justify-between items-center relative z-10">
                        <div className="flex items-center space-x-3">
                            <div className="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-2xl border border-[var(--bg-cream)]">
                                🧑‍🌾
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-[var(--text-dark)] flex items-center">
                                    Lv.{data.player.level} 園丁
                                </h1>
                                <div className="w-24 mt-1">
                                    <div className="exp-bar shadow-inner">
                                        <div className="exp-fill" style={{ width: `${percent}%` }}></div>
                                    </div>
                                    <p className="text-[9px] font-bold text-[var(--text-muted)] mt-0.5 tracking-wider">
                                        ☀️ {data.player.exp} / {data.player.maxExp}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </header>
                );
            };

            const renderAssetWater = () => {
                const waterHeight = Math.min(100, Math.max(30, (data.assets / 100000) * 100)) + '%';
                return (
                    <div className="bento-card !pb-8 !pt-6">
                        <div className="relative z-10">
                            <p className="text-[var(--text-muted)] text-sm font-bold mb-1">現有總水源 (資產)</p>
                            <h1 className="text-4xl font-black tracking-tight">${data.assets.toLocaleString()}</h1>
                        </div>
                        <div className="water-container" style={{ height: waterHeight }}>
                            <div className="wave"></div>
                            <div className="wave"></div>
                        </div>
                    </div>
                );
            };

            // 2. 每日任務 (RPG 元素)
            const renderTasks = () => {
                const tasksArr = Object.values(data.tasks);
                const allDone = tasksArr.every(t => t.done);

                return (
                    <div className="bento-card">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="font-bold text-lg flex items-center">
                                <span className="text-2xl mr-2">🎯</span> 今日灌溉任務
                            </h2>
                            {allDone && <span className="text-xs bg-[var(--green-soft)] text-white px-2 py-1 rounded-lg font-bold">完美達成 ✨</span>}
                        </div>
                        <div className="space-y-3">
                            {tasksArr.map((task, idx) => (
                                <div key={idx} className={`flex items-center justify-between p-3 rounded-2xl border ${task.done ? 'bg-[#F9FAF8] border-transparent' : 'bg-white border-[#E8EBE9] shadow-sm'}`}>
                                    <div className="flex items-center space-x-3">
                                        <div className={`task-checkbox ${task.done ? 'task-done' : ''}`}>
                                            {task.done && <span className="text-white text-sm">✓</span>}
                                        </div>
                                        <span className={`font-bold ${task.done ? 'text-[var(--text-muted)] line-through' : 'text-[var(--text-dark)]'}`}>
                                            {task.title}
                                        </span>
                                    </div>
                                    <div className="flex space-x-1 text-[11px] font-black">
                                        <span className="bg-[#FFF8E7] text-[#D4A373] px-2 py-1 rounded-md">☀️ {task.rewardExp}</span>
                                        <span className="bg-[#EAF3FA] text-[#82A8C7] px-2 py-1 rounded-md">💧 {task.rewardMoney}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // 3. 本月收支統計 (月度報表)
            const renderMonthlyStats = () => {
                const { total, stats } = calculateStats();

                return (
                    <div className="bento-card mb-24">
                        <div className="flex justify-between items-end mb-5">
                            <div>
                                <h2 className="font-bold text-lg flex items-center mb-1">
                                    <span className="text-2xl mr-2">📊</span> 本月帳本
                                </h2>
                                <p className="text-[22px] font-black tracking-tight">${total.toLocaleString()}</p>
                            </div>
                            <div className="text-[10px] font-bold text-[var(--text-muted)] bg-[#F4F5F3] px-2 py-1 rounded-lg">
                                依金額排序
                            </div>
                        </div>

                        <div className="space-y-4">
                            {stats.map((stat, idx) => (
                                <div key={idx}>
                                    <div className="flex justify-between text-sm font-bold mb-1.5">
                                        <span className="text-[var(--text-dark)]">{stat.label}</span>
                                        <div className="text-right">
                                            <span className="text-[var(--text-muted)] mr-2">{stat.percent}%</span>
                                            <span>${stat.amount.toLocaleString()}</span>
                                        </div>
                                    </div>
                                    <div className="stat-bar">
                                        <div 
                                            className="stat-fill" 
                                            style={{ width: `${stat.percent}%`, backgroundColor: stat.color }}
                                        ></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // --- 底部表單面板 ---
            const renderActionOverlay = () => {
                if (!showActionMenu) return null;

                return (
                    <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
                        <div className="flex-1" onClick={() => {setShowActionMenu(false); setActiveForm(null);}}></div>
                        
                        <div className="bottom-sheet p-6 animate-in slide-in-from-bottom-full duration-300">
                            <div className="w-12 h-1.5 bg-[#E8EBE9] rounded-full mx-auto mb-6"></div>
                            
                            {/* 選單模式 */}
                            {showActionMenu && !activeForm && (
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <button onClick={() => setActiveForm('expense')} className="flex flex-col items-center p-5 bg-[#F4F5F3] rounded-3xl active:scale-95 transition-transform">
                                        <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center text-3xl shadow-sm mb-3">💸</div>
                                        <span className="text-sm font-bold text-[var(--text-dark)]">記筆開銷</span>
                                        <span className="text-[10px] font-bold text-[var(--text-muted)] mt-1">解任務拿獎勵</span>
                                    </button>
                                    <button onClick={() => setActiveForm('diary')} className="flex flex-col items-center p-5 bg-[#F4F5F3] rounded-3xl active:scale-95 transition-transform">
                                        <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center text-3xl shadow-sm mb-3">✍️</div>
                                        <span className="text-sm font-bold text-[var(--text-dark)]">寫篇日記</span>
                                        <span className="text-[10px] font-bold text-[var(--text-muted)] mt-1">梳理今日心情</span>
                                    </button>
                                </div>
                            )}

                            {/* 記帳表單 */}
                            {activeForm === 'expense' && (
                                <div className="space-y-4 mb-4">
                                    <h3 className="font-bold text-lg flex items-center"><span className="text-2xl mr-2">💸</span>紀錄今日開銷</h3>
                                    <div className="flex space-x-2">
                                        <select 
                                            value={tempCategory} 
                                            onChange={e=>setTempCategory(e.target.value)}
                                            className="input-eco w-1/3 bg-white"
                                        >
                                            <option value="food">🍔 餐飲</option>
                                            <option value="shopping">🛍️ 購物</option>
                                            <option value="transport">🚗 交通</option>
                                            <option value="life">🏠 生活</option>
                                        </select>
                                        <input type="number" value={tempAmount} onChange={e=>setTempAmount(e.target.value)} placeholder="花費金額 ($)" className="input-eco w-2/3 bg-white" autoFocus/>
                                    </div>
                                    <button onClick={handleRecordExpense} className="w-full bg-[var(--text-dark)] text-white font-bold py-4 rounded-2xl active:scale-95 transition-transform">
                                        確認紀錄
                                    </button>
                                </div>
                            )}

                            {/* 日記表單 */}
                            {activeForm === 'diary' && (
                                <div className="space-y-4 mb-4">
                                    <h3 className="font-bold text-lg flex items-center"><span className="text-2xl mr-2">✍️</span>種下今日回憶</h3>
                                    <textarea value={tempText} onChange={e=>setTempText(e.target.value)} placeholder="今天發生了什麼事呢？" rows="3" className="input-eco bg-white resize-none" autoFocus></textarea>
                                    <button onClick={handleRecordDiary} className="w-full bg-[var(--text-dark)] text-white font-bold py-4 rounded-2xl active:scale-95 transition-transform">
                                        封存回憶
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative pb-10">
                    {toastMsg && <div className="toast">{toastMsg}</div>}

                    {renderProfile()}

                    <main className="max-w-md mx-auto px-4">
                        {renderAssetWater()}
                        {renderTasks()}
                        {renderMonthlyStats()}
                    </main>

                    {/* 懸浮動作按鈕 (FAB) */}
                    <div className="fixed bottom-6 right-6 z-40">
                        <button 
                            onClick={() => { setShowActionMenu(true); setActiveForm(null); }}
                            className="fab-btn w-16 h-16 text-3xl font-light"
                        >
                            +
                        </button>
                    </div>

                    {renderActionOverlay()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
